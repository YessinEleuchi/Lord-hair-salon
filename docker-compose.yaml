services:
  postgres:
    image: postgres:17
    container_name: lord-hair-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: lordhair
      POSTGRES_PASSWORD: lordhair_local_password
      POSTGRES_DB: lordhair

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U lordhair -d lordhair"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: